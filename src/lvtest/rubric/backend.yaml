version: "1"
track: backend
label: 백엔드
levels:
  1: 입문
  2: 주니어
  3: 미드
  4: 시니어
  5: 스태프
stages:
  1: {goal: "경험 확인 — 구체적으로 뭘 어떻게 했나", pass_level: 2}
  2: {goal: "근거 — 왜 그 선택을 했나, 대안은 무엇이었나", pass_level: 3}
  3: {goal: "트레이드오프·한계 — 그 선택의 단점은, 어떤 상황에서 깨지나", pass_level: 4}
  4: {goal: "심화 — 트래픽 10배·요구 변경·장애 조건에서는 어떻게 하나", pass_level: 5}
axes:
  api_design:
    name: API·서비스 설계
    description: 계약 설계, 에러 응답, 버저닝, 멱등성, 인증 경계
    levels:
      1: ["프레임워크 예제 수준의 엔드포인트를 만든다", "HTTP 메서드·상태 코드의 의미를 구분하지 못한다"]
      2: ["REST 규약에 맞는 리소스·메서드를 설계한다", "에러 응답 형식을 통일해 본 경험이 있다", "요청 검증을 프레임워크 기능으로 처리한다"]
      3: ["멱등성·페이지네이션·부분 실패를 고려한 API를 설계한다", "클라이언트와 계약(스키마·버전)을 합의하고 깨지지 않게 변경한 경험", "인증·권한을 API 경계에서 일관되게 처리한다"]
      4: ["하위 호환을 유지하며 API를 진화시키는 버저닝·폐기 정책을 운영했다", "여러 팀·외부 파트너가 쓰는 API 계약을 설계하고 문서·SDK로 지원했다", "게이트웨이·레이트리밋·타임아웃 정책을 설계했다"]
      5: ["조직 차원의 API 설계 표준과 리뷰 프로세스를 만들어 정착시켰다", "도메인 경계에 맞춰 API 표면을 재설계해 시스템 결합도를 낮춘 사례가 있다"]
    probes:
      1: "이력서의 API/서비스 언급을 인용하고, 엔드포인트 하나를 골라 요청·응답·에러 형식을 직접 설명하게 하라"
      2: "그 API 형태(리소스 구조·에러 형식·인증 방식)를 왜 그렇게 정했는지, 다른 선택지와 비교하게 하라"
      3: "클라이언트가 재시도하거나 필드를 바꿔야 할 때, 부분 실패가 날 때 그 설계가 어떻게 깨지는지 물어라"
      4: "외부 파트너 다수가 쓰고 하위 호환을 2년 유지해야 하는 조건으로 바꿔 어떻게 진화시킬지 물어라"
  data_db:
    name: 데이터 모델링·DB·트랜잭션
    description: 스키마, 인덱스, 격리 수준, 락, 마이그레이션
    levels:
      1: ["ORM으로 CRUD를 만든다", "트랜잭션·인덱스 개념을 설명하지 못한다"]
      2: ["기본 인덱스를 만들고 느린 쿼리를 EXPLAIN으로 본 적이 있다", "트랜잭션을 '묶는 것' 정도로 이해하고 사용한다"]
      3: ["격리 수준 차이를 알고 실제 선택 근거를 말한다", "N+1을 인지하고 해결한 경험이 있다", "정규화·비정규화를 조회 패턴 기준으로 결정한다"]
      4: ["락 경합·데드락을 진단하고 설계(락 순서·낙관적 락·큐)로 회피한 경험", "무중단 스키마 마이그레이션을 설계·실행했다", "복합·커버링 인덱스를 실행 계획 기준으로 튜닝했다"]
      5: ["데이터 모델 변경이 여러 서비스·팀에 미치는 영향을 관리했다", "요구사항에서 일관성 모델(강한/최종)을 도출하고 샤딩·리플리케이션 전략을 결정했다"]
    probes:
      1: "이력서의 DB/데이터 관련 주장을 인용하고, 본인이 직접 설계·작성한 범위(테이블·쿼리·트랜잭션)를 특정하게 하라"
      2: "왜 그 격리 수준/락/스키마/인덱스를 골랐는지, 대안과 비교하게 하라"
      3: "핫 로우·롱 트랜잭션·스키마 변경·데이터 급증 상황에서 그 선택이 어떻게 깨지는지 물어라"
      4: "데이터 10배·다중 리전·강한 일관성 요구·무중단 마이그레이션 조건으로 바꿔 설계를 다시 하게 하라"
  concurrency_perf:
    name: 동시성·성능·캐싱
    description: 경쟁 조건, N+1, 캐시 무효화, 병목 측정, 풀 설정
    levels:
      1: ["동시 요청이 문제를 일으킬 수 있다는 인식이 없다", "성능 대응은 '느리면 서버를 키운다' 수준이다"]
      2: ["경쟁 조건이 무엇인지 알고 락으로 막아 본 경험이 있다", "캐시를 붙여 응답 속도를 개선한 경험이 있다(무효화는 단순 TTL)"]
      3: ["병목을 측정(프로파일링·APM·부하 테스트)해서 찾고 고친 경험이 있다", "캐시 무효화 전략과 정합성 문제를 설명한다", "커넥션 풀·스레드 풀 크기를 근거 있게 설정한다"]
      4: ["분산 락·멱등 키·아웃박스 같은 패턴으로 분산 환경의 경쟁 조건을 해결했다", "캐시 스탬피드·핫키·장애 시 폴백을 설계했다", "p99 지연·처리량 목표를 정하고 달성한 경험이 있다"]
      5: ["시스템 전체의 용량 계획과 성능 예산을 세우고 팀들이 지키게 했다", "백프레셔·부하 차단·우선순위 큐 등 과부하 대응 아키텍처를 설계했다"]
    probes:
      1: "이력서의 성능 개선/동시성/캐시 주장을 인용하고, 무엇을 어떻게 측정해서 얼마나 개선했는지 특정하게 하라"
      2: "왜 그 방법(락 종류, 캐시 위치·TTL, 풀 크기)을 골랐는지, 대안은 무엇이었는지 물어라"
      3: "캐시가 틀린 값을 주거나, 락이 오래 잡히거나, 트래픽이 몰릴 때 그 설계가 어떻게 깨지는지 물어라"
      4: "트래픽 10배·인스턴스 다중화·부분 장애 조건으로 바꿔 동시성과 성능 설계를 다시 하게 하라"
  architecture:
    name: 아키텍처·트레이드오프
    description: 레이어링, 도메인 경계, 메시징, 모놀리스↔MSA 판단
    levels:
      1: ["프레임워크가 정해 준 폴더 구조를 그대로 쓴다", "왜 그렇게 나눴는지 설명하지 못한다"]
      2: ["컨트롤러/서비스/리포지토리 레이어를 나누고 역할을 설명한다", "모듈 간 의존 방향을 의식한다"]
      3: ["도메인 경계를 기준으로 모듈을 나누고 그 근거를 말한다", "동기 호출과 비동기 메시징을 상황에 따라 선택한 경험이 있다", "모놀리스↔MSA 선택을 팀 규모·배포·데이터 관점에서 설명한다"]
      4: ["서비스 분리·통합을 주도하고 데이터 소유권·일관성·장애 격리를 설계했다", "이벤트 기반 아키텍처에서 순서·중복·유실을 처리한 경험이 있다", "기술 부채를 측정하고 점진적 리팩터링 전략을 실행했다"]
      5: ["여러 팀에 걸친 시스템 경계를 설계하고 조직 구조와 정렬시켰다", "아키텍처 결정을 ADR 등으로 남기고 조직의 기술 방향을 이끌었다"]
    probes:
      1: "이력서의 아키텍처/구조 언급을 인용하고, 어떤 단위로 나눴고 본인이 결정한 부분이 어디인지 특정하게 하라"
      2: "왜 그렇게 나눴는지(레이어·모듈·서비스·동기/비동기), 다른 구조와 비교해 트레이드오프를 말하게 하라"
      3: "기능이 늘거나 팀이 커지거나 한 모듈이 장애 날 때 그 구조가 어떻게 깨지는지 물어라"
      4: "팀 3개가 동시에 개발하고 배포 주기가 다르며 데이터 소유권이 겹치는 조건으로 구조를 다시 설계하게 하라"
  testing_quality:
    name: 테스트·품질
    description: 테스트 전략, 무엇을 안 테스트하는지, CI, 코드 리뷰
    levels:
      1: ["테스트를 거의 쓰지 않거나 수동으로만 확인한다", "테스트 종류를 구분하지 못한다"]
      2: ["단위 테스트를 쓰고 CI에서 돌린다", "테스트 픽스처·목을 사용해 본 경험이 있다"]
      3: ["단위/통합/E2E를 목적에 따라 구분하고 비율을 결정한다", "무엇을 테스트하지 않을지와 그 이유를 말한다", "테스트가 깨지기 쉬운 이유(시간·외부 의존)를 알고 격리한다"]
      4: ["테스트 전략으로 배포 신뢰도를 높인 경험(플래키 제거·계약 테스트·테스트 컨테이너)이 있다", "코드 리뷰 기준과 정적 분석을 팀에 정착시켰다", "회귀를 막는 테스트 설계를 리뷰에서 요구한다"]
      5: ["조직의 품질 지표(결함 탈출률·복구 시간)를 정의하고 개선했다", "테스트 인프라·가이드를 만들어 여러 팀이 채택했다"]
    probes:
      1: "이력서의 테스트/품질/CI 언급을 인용하고, 어떤 테스트를 직접 썼고 무엇을 검증했는지 특정하게 하라"
      2: "왜 그 종류의 테스트를 그 비율로 썼는지, 목/실DB 등 선택 근거와 대안을 물어라"
      3: "테스트가 통과했는데 운영에서 깨진 사례, 플래키 테스트, 외부 의존이 있을 때 어떻게 되는지 물어라"
      4: "배포를 하루 여러 번 해야 하고 서비스 5개가 서로 의존하는 조건으로 테스트 전략을 다시 세우게 하라"
  ops_infra:
    name: 운영·배포·관측
    description: 배포 방식, 로그·메트릭·트레이스, 장애 대응, SLO
    levels:
      1: ["배포는 남이 해 주거나 수동 복사로 한다", "로그를 print로 확인한다"]
      2: ["Docker로 패키징하고 CI/CD로 배포해 본 경험이 있다", "구조화된 로그와 기본 메트릭을 본다"]
      3: ["장애를 로그·메트릭·트레이스로 추적해 원인을 찾은 경험이 있다", "롤백·헬스체크·무중단 배포를 설정했다", "알림 기준을 정하고 온콜 대응을 했다"]
      4: ["SLO를 정의하고 에러 예산 기반으로 운영한 경험이 있다", "장애 회고를 주도하고 재발 방지를 시스템으로 반영했다", "인프라를 코드로 관리하고 환경 간 드리프트를 제거했다"]
      5: ["조직 전체의 관측성·배포 플랫폼을 설계하고 도입했다", "대규모 장애의 지휘를 맡고 프로세스를 개선했다"]
    probes:
      1: "이력서의 배포/운영/모니터링/장애 언급을 인용하고, 본인이 직접 구성·대응한 범위를 특정하게 하라"
      2: "왜 그 배포 방식/모니터링 도구/알림 기준을 골랐는지, 대안과 비교하게 하라"
      3: "배포 직후 에러율이 오르거나 새벽에 알림이 왔을 때 실제로 어떻게 추적했는지, 그 체계의 빈틈을 물어라"
      4: "서비스 20개·다중 리전·SLO 99.9% 조건으로 배포와 관측 체계를 다시 설계하게 하라"
  security:
    name: 보안·인증
    description: 인증/인가 구조, 토큰 수명, 비밀 관리, OWASP
    levels:
      1: ["인증을 프레임워크 기본값으로만 쓴다", "비밀번호·토큰 저장 방식을 설명하지 못한다"]
      2: ["세션/JWT 인증을 구현해 본 경험이 있다", "비밀 값을 환경 변수로 분리한다", "SQL 인젝션·XSS를 알고 프레임워크로 막는다"]
      3: ["인증과 인가를 구분하고 권한 모델(역할·리소스)을 설계한 경험이 있다", "토큰 만료·갱신·폐기 전략을 설명한다", "OWASP Top 10을 실제 코드 리뷰에 적용한다"]
      4: ["OAuth2/OIDC 흐름을 설계하고 서비스 간 인증(mTLS·서비스 토큰)을 구현했다", "비밀 관리(Vault·KMS)와 키 로테이션을 운영했다", "위협 모델링을 하고 취약점 대응 프로세스를 운영했다"]
      5: ["조직의 보안 아키텍처와 정책을 설계하고 감사·컴플라이언스 대응을 주도했다", "보안 사고 대응을 지휘하고 체계를 개선했다"]
    probes:
      1: "이력서의 인증/보안 언급을 인용하거나, 언급이 없으면 프로젝트 하나를 골라 로그인·권한 처리를 어떻게 했는지 특정하게 하라"
      2: "왜 그 인증 방식(세션/JWT/OAuth)과 권한 모델을 골랐는지, 대안과 비교하게 하라"
      3: "토큰이 유출되거나 권한이 바뀌거나 내부 서비스 간 호출이 생길 때 그 설계가 어떻게 깨지는지 물어라"
      4: "외부 파트너 연동·감사 요구·다중 테넌트 조건으로 인증·인가 체계를 다시 설계하게 하라"
