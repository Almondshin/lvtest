version: "1"
track: devops
label: 데브옵스
levels:
  1: 입문
  2: 주니어
  3: 미드
  4: 시니어
  5: 스태프
stages:
  1: {goal: "경험 확인 — 구체적으로 뭘 어떻게 했나", pass_level: 2}
  2: {goal: "근거 — 왜 그 선택을 했나, 대안은 무엇이었나", pass_level: 3}
  3: {goal: "트레이드오프·한계 — 그 선택의 단점은, 어떤 상황에서 깨지나", pass_level: 4}
  4: {goal: "심화 — 규모 10배·리전 장애·규제 조건에서는 어떻게 하나", pass_level: 5}
axes:
  iac_provisioning:
    name: IaC·프로비저닝
    description: 코드로 인프라 관리, 상태 관리, 모듈화, 드리프트, 변경 안전장치
    levels:
      1: ["콘솔에서 클릭으로 리소스를 만든다", "인프라 변경 이력이 어디에도 남지 않는다"]
      2: ["남이 만든 IaC 코드를 고쳐 apply 해 본 경험이 있다", "환경별 변수 분리는 하지만 상태 파일 관리는 신경 쓰지 않는다"]
      3: ["원격 상태 저장과 잠금을 구성하고 왜 필요한지 설명한다", "모듈로 환경 간 중복을 줄이고 plan 결과를 리뷰 대상으로 삼는다", "수동 변경으로 생긴 드리프트를 감지해 코드로 되돌린 경험이 있다"]
      4: ["수동으로 만들어진 기존 리소스를 무중단으로 코드에 편입시켜 이관했다", "상태와 의존 경계를 나눠 한 번의 실수가 미치는 범위를 줄였다", "리소스 재생성·삭제를 유발하는 변경을 정책·리뷰 게이트로 막는 체계를 만들었다"]
      5: ["조직 표준 모듈과 프로비저닝 파이프라인을 만들어 여러 팀이 쓰게 했다", "멀티 계정·멀티 리전 인프라의 소유권과 변경 절차를 설계했다"]
    probes:
      1: "이력서의 IaC/프로비저닝 언급을 인용하고, 본인이 직접 작성하고 apply 한 범위와 어떤 리소스였는지 특정하게 하라"
      2: "왜 그 도구·모듈 구조·상태 저장 방식을 골랐는지, 대안과 비교하게 하라"
      3: "누가 콘솔에서 손으로 고쳤거나 apply 가 중간에 실패했을 때 실제로 어떻게 됐는지, 그 구성의 빈틈을 물어라"
      4: "계정 10개·리전 3개를 여러 팀이 동시에 고치는 조건으로 코드 구조와 변경 권한을 다시 설계하게 하라"
  cicd_delivery:
    name: CI/CD·릴리스
    description: 파이프라인 설계, 배포 전략, 롤백, 아티팩트 승격, 배포 지표
    levels:
      1: ["빌드와 배포를 로컬에서 수동으로 한다", "파이프라인을 만들어 본 적이 없다"]
      2: ["기존 파이프라인에 잡을 추가하고 실패를 고쳐 본 경험이 있다", "빌드·테스트·배포 단계를 나눌 줄 안다"]
      3: ["블루그린·카나리 같은 배포 전략을 상황에 맞게 고르고 롤백 절차를 갖췄다", "아티팩트를 불변으로 만들고 환경별 승격 흐름을 설계했다", "파이프라인 실패를 원인별로 나눠 재시도 기준과 차단 기준을 정했다"]
      4: ["배포 빈도·리드타임·변경 실패율을 측정해 개선한 경험이 있다", "파이프라인 자격증명을 단기 토큰·최소 권한으로 분리했다", "DB 마이그레이션과 애플리케이션 배포의 순서와 호환을 설계해 무중단으로 굴렸다"]
      5: ["조직 공통 배포 플랫폼이나 표준 파이프라인을 만들어 팀들이 채택하게 했다", "승인·감사·배포 동결을 포함한 릴리스 정책을 설계하고 규제 요구를 만족시켰다"]
    probes:
      1: "이력서의 CI/CD·배포 자동화 언급을 인용하고, 파이프라인의 어느 단계를 본인이 직접 만들었는지 특정하게 하라"
      2: "왜 그 배포 전략과 파이프라인 구조를 골랐는지, 다른 방식과 비교해 근거를 말하게 하라"
      3: "배포 중간에 실패했거나 롤백해야 했던 실제 상황을 묻고, 그때 데이터·트래픽이 어떻게 됐는지 파고들어라"
      4: "하루 수십 번 배포하고 서비스가 서로 의존하며 롤백이 불가능한 마이그레이션이 낀 조건으로 릴리스 전략을 다시 세우게 하라"
  container_orchestration:
    name: 컨테이너·오케스트레이션
    description: 이미지 빌드, 스케줄링, 리소스 요청·제한, 롤아웃, 클러스터 운영
    levels:
      1: ["Dockerfile을 예제에서 복사해 쓴다", "컨테이너와 가상 머신의 차이를 설명하지 못한다"]
      2: ["이미지를 직접 만들어 레지스트리에 올리고 배포해 본 경험이 있다", "파드·서비스 상태를 명령으로 확인할 줄 안다"]
      3: ["리소스 요청·제한을 근거 있게 정하고 메모리 종료나 CPU 스로틀링을 진단한 경험이 있다", "준비성·생존성 프로브와 롤링 업데이트가 실제로 어떻게 동작하는지 설명한다", "베이스 이미지와 레이어 구조를 크기·보안 근거로 정한다"]
      4: ["노드 드레인·중단 예산·배치 규칙 때문에 배포가 멈춘 상황을 진단하고 설계로 해결했다", "파드 오토스케일러와 노드 오토스케일러의 상호작용을 이해하고 튜닝했다", "클러스터 버전 업그레이드를 무중단으로 계획하고 실행했다"]
      5: ["멀티 클러스터·멀티 테넌트 구조와 격리 정책을 설계했다", "내부 플랫폼이나 오퍼레이터로 추상화해 개발팀의 인지 부하를 줄였다"]
    probes:
      1: "이력서의 컨테이너/쿠버네티스 언급을 인용하고, 본인이 직접 작성한 매니페스트나 운영한 클러스터 범위를 특정하게 하라"
      2: "왜 그 리소스 값·프로브 설정·배포 방식을 그렇게 정했는지, 근거와 대안을 물어라"
      3: "파드가 계속 재시작하거나 배포가 롤아웃 중에 멈췄을 때 실제로 어떻게 원인을 좁혔는지 물어라"
      4: "노드 수백 대·팀 여러 개가 한 클러스터를 공유하고 업그레이드를 분기마다 해야 하는 조건으로 운영 구조를 다시 설계하게 하라"
  observability_incident:
    name: 관측·장애 대응
    description: 로그·메트릭·트레이스, 알림 설계, 온콜, SLO, 사후 분석
    levels:
      1: ["문제가 나면 로그를 눈으로 훑는다", "무엇을 봐야 하는지 모른다"]
      2: ["대시보드를 만들고 CPU·메모리·에러율 같은 기본 지표를 본다", "알림을 설정해 본 경험이 있다"]
      3: ["장애를 메트릭에서 로그·트레이스로 좁혀 원인을 찾은 경험이 있다", "증상 기반 알림과 원인 기반 알림을 구분하고 노이즈를 줄였다", "카디널리티·보존 기간·비용을 고려해 무엇을 수집할지 정한다"]
      4: ["SLI와 SLO를 정의하고 에러 예산을 실제 운영 판단에 썼다", "장애 회고를 주도하고 재발 방지를 자동화·시스템으로 반영했다", "분산 트레이싱을 도입해 서비스 간 지연의 원인을 규명했다"]
      5: ["조직 전체의 관측 표준과 플랫폼을 설계하고 비용까지 관리했다", "대규모 장애의 지휘를 맡고 온콜·에스컬레이션 체계를 개선했다"]
    probes:
      1: "이력서의 모니터링/알림/장애 대응 언급을 인용하고, 본인이 직접 구성한 지표와 대응한 장애를 특정하게 하라"
      2: "왜 그 지표와 알림 임계값을 골랐는지, 다른 기준과 비교해 근거를 말하게 하라"
      3: "새벽에 알림이 왔을 때 실제로 무엇을 어떤 순서로 봤는지, 알림이 울리지 않았던 장애는 없었는지 물어라"
      4: "서비스 50개·다중 리전·가용성 목표 99.9% 조건으로 관측 체계와 온콜 구조를 다시 설계하게 하라"
  reliability_scaling:
    name: 신뢰성·확장·용량
    description: 가용성 설계, 오토스케일링, 부하 대응, 백업·재해 복구, 용량과 비용
    levels:
      1: ["인스턴스 하나로 띄워 두고 죽으면 다시 띄운다", "가용성이나 확장을 고민해 본 적이 없다"]
      2: ["오토스케일링 그룹과 로드밸런서를 구성해 본 경험이 있다", "백업이 돌고 있다는 것은 안다"]
      3: ["단일 장애점을 찾아 다중 가용영역·다중 인스턴스로 없앤 경험이 있다", "부하 테스트로 한계를 재고 스케일 기준을 지표와 임계값으로 정했다", "백업에서 실제로 복구해 보고 복구 목표 시간과 시점을 확인했다"]
      4: ["헬스체크·타임아웃·재시도·차단을 계층별로 설계해 장애 전파를 끊었다", "리전 장애를 가정한 복구 시나리오를 설계하고 훈련으로 검증했다", "용량 계획과 비용을 함께 놓고 인스턴스 타입·구매 방식을 결정했다"]
      5: ["조직의 가용성 목표와 아키텍처 원칙을 정의하고 관철시켰다", "의도적으로 장애를 주입해 신뢰성을 검증하는 체계를 만들었다"]
    probes:
      1: "이력서의 가용성/확장/장애 관련 언급을 인용하고, 본인이 직접 구성한 이중화나 스케일링 범위를 특정하게 하라"
      2: "왜 그 스케일 기준·이중화 수준·백업 주기를 골랐는지, 대안과 비교하게 하라"
      3: "트래픽이 갑자기 몰렸거나 인스턴스가 한꺼번에 죽었을 때 실제로 어떻게 됐는지, 스케일이 못 따라간 지점을 물어라"
      4: "리전 하나가 통째로 죽고 복구 목표가 30분인 조건으로 가용성과 복구 설계를 다시 하게 하라"
  network_infra:
    name: 네트워크·인프라
    description: VPC·서브넷·라우팅, DNS, 로드밸런서, TLS, 트래픽 경로
    levels:
      1: ["네트워크는 남이 잡아 준 대로 쓴다", "사설망과 공인망, 서브넷 개념을 설명하지 못한다"]
      2: ["보안 그룹이나 방화벽 규칙을 열고 닫아 본 경험이 있다", "DNS 레코드를 추가하고 인증서를 붙여 본 적이 있다"]
      3: ["VPC·서브넷·라우팅·아웃바운드 경로를 설계하고 왜 그렇게 나눴는지 설명한다", "L4와 L7 로드밸런서의 차이를 알고 헬스체크·타임아웃 값을 근거 있게 정한다", "TLS 종료 지점을 정하고 인증서 갱신을 자동화했다"]
      4: ["온프레미스와 클라우드 연결을 설계하고 운영한 경험이 있다", "연결 실패를 패킷·커넥션 수준에서 진단한 경험이 있다", "인그레스 계층이나 서비스 메시로 트래픽 정책을 통제했다"]
      5: ["멀티 계정·멀티 리전 네트워크 토폴로지와 주소 체계를 표준으로 설계했다", "네트워크 경계와 트래픽 정책을 조직의 보안 요구와 정렬시켰다"]
    probes:
      1: "이력서의 네트워크/VPC/로드밸런서 언급을 인용하고, 본인이 직접 설계하거나 변경한 범위를 특정하게 하라"
      2: "왜 그렇게 서브넷을 나누고 그 로드밸런서·인증서 구성을 골랐는지, 대안과 비교하게 하라"
      3: "특정 구간만 연결이 안 되거나 간헐적으로 끊겼을 때 어디부터 확인했는지, 그 구조의 빈틈을 물어라"
      4: "계정 여러 개와 온프레미스가 사설망으로 연결되고 주소 대역이 겹치는 조건으로 네트워크를 다시 설계하게 하라"
  security_compliance:
    name: 보안·시크릿·컴플라이언스
    description: 권한 설계, 시크릿 관리, 이미지·취약점, 접근 통제, 감사 대응
    levels:
      1: ["관리자 권한을 공유해서 쓴다", "시크릿을 코드나 메신저에 둔다"]
      2: ["시크릿을 환경 변수나 시크릿 저장소로 분리했다", "역할 단위로 권한을 나눠 본 경험이 있다"]
      3: ["최소 권한 원칙으로 권한 정책을 설계하고 과한 권한을 줄인 경험이 있다", "시크릿의 저장·주입·교체 흐름을 설명한다", "이미지와 의존성 취약점 스캔을 파이프라인에 넣고 차단 기준을 정했다"]
      4: ["단기 자격증명으로 장기 키를 제거했다", "감사 로그를 남기고 운영 서버 접근 경로를 통제했다", "규제나 인증 요구를 인프라 통제 항목으로 옮겨 구현했다"]
      5: ["조직의 클라우드 보안 기준과 가드레일을 정책 코드로 설계해 정착시켰다", "보안 사고 대응 절차를 설계하고 훈련과 개선을 이끌었다"]
    probes:
      1: "이력서의 권한/시크릿/보안 언급을 인용하거나, 언급이 없으면 운영한 시스템 하나를 골라 배포 자격증명과 서버 접근을 어떻게 관리했는지 특정하게 하라"
      2: "왜 그 권한 구조와 시크릿 관리 방식을 골랐는지, 대안과 비교하게 하라"
      3: "키가 유출됐거나 퇴사자 권한이 남았거나 스캔이 취약점을 대량으로 뱉었을 때 실제로 어떻게 했는지 물어라"
      4: "외부 감사를 받고 접근 기록을 전부 남겨야 하며 팀이 여러 계정을 쓰는 조건으로 권한과 시크릿 체계를 다시 설계하게 하라"
