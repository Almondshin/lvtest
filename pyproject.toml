[project]
name = "lvtest"
version = "0.1.0"
description = "이력서 기반 백엔드 개발자 레벨테스트 — 꼬리 질문 인터뷰 엔진"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.scripts]
lvtest = "lvtest.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lvtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
